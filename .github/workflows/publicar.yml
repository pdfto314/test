name: Publicar site

# Publica o site no GitHub Pages a cada mudança na main.
# O playlist.json é GERADO AQUI (não fica no repositório), então nenhum robô faz
# commit na main e ninguém precisa dar "git pull" depois de enviar sons.
# Requisito (uma vez): Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar playlist.json
        run: |
          pip install --quiet mutagen
          python ferramentas/gerar_playlist.py

      - name: Montar o site
        run: |
          mkdir _site
          cp -r index.html style.css manifest.webmanifest .nojekyll js icons audio \
                playlist.json cenas.json credits.json renomeados.json _site/
          echo "Sons publicados: $(find _site/audio -type f | wc -l)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
