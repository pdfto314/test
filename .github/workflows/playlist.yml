name: Atualizar playlist.json

# Regenera playlist.json sempre que áudios forem adicionados/removidos/renomeados.
on:
  push:
    branches: [main]
    paths:
      - "audio/**"
      - "ferramentas/gerar_playlist.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playlist
  cancel-in-progress: false

jobs:
  playlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Gerar playlist.json
        run: |
          pip install --quiet mutagen
          python ferramentas/gerar_playlist.py

      - name: Commit se a lista de faixas mudou
        run: |
          # ignora mudança só no campo "generated" (data/hora)
          if git diff --quiet -I '"generated"' -- playlist.json; then
            echo "playlist.json já está atualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.json
          git commit -m "Atualiza playlist.json"
          git push
